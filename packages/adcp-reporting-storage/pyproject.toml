[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adcp-reporting-storage"
version = "0.2.0b0"
description = "PostgreSQL and object-storage implementations of the AdCP Reliable Reporting stores"
authors = [
    {name = "AdCP Community", email = "maintainers@adcontextprotocol.org"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
keywords = ["adcp", "reporting", "postgresql", "advertising"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    # The store protocols, in-memory stores, producer, handlers, row encoding
    # and record codecs this distribution implements against. The stores in
    # this package subclass nothing in ``adcp`` but import its private
    # ``adcp.reporting`` helpers, so the range is one major: a new ``adcp``
    # major means a new release here.
    #
    # On next this range also admits adcp 10 pre-releases: next releases this
    # distribution as its SDK 10 companion (0.2.0-beta.N), and the workspace
    # must still install while pyproject.toml carries main's version. At
    # ratification the range narrows to ``adcp>=10.0.0,<11`` (RELEASING.md).
    "adcp>=9.0.0,<11",
    # RFC 8785 canonical JSON for row bodies and object keys; the same pin as adcp.
    "rfc8785>=0.1.4",
]

[project.optional-dependencies]
pg = [
    # Every store in this package is PostgreSQL-backed. psycopg3 ships both
    # sync and async pool interfaces; the stores take an AsyncConnectionPool.
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.2.0",
]
gcs = [
    # Row storage on Google Cloud Storage. The provider takes a client you build,
    # with keyless credentials; it never imports the library itself.
    "google-cloud-storage>=2.18",
]
s3 = [
    # Row storage on Amazon S3 or an S3-compatible store (needs bucket versioning).
    "boto3>=1.35",
]
azure = [
    # Row storage on Azure Blob Storage (needs blob versioning on the account).
    "azure-storage-blob>=12.20",
]

# adcp discovers these without importing this distribution by name.
[project.entry-points."adcp.storage"]
postgres = "adcp_reporting_storage.storage:postgres_storage"

[project.entry-points."adcp.commands"]
migrate = "adcp_reporting_storage.migrations.cli:main"

[project.urls]
Homepage = "https://github.com/adcontextprotocol/adcp-client-python"
Documentation = "https://github.com/adcontextprotocol/adcp-client-python/blob/main/packages/adcp-reporting-storage/README.md"
Repository = "https://github.com/adcontextprotocol/adcp-client-python"
Issues = "https://github.com/adcontextprotocol/adcp-client-python/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adcp_reporting_storage = [
    "py.typed",
    "ledger/*.sql",
    "ledger/*.json",
    "outbox/*.json",
    "materializer/*.json",
    "receipts/*.json",
    "feed/*.json",
    "projection/*.json",
    "production/*.json",
    "production/*.sql",
    "subscriptions/*.sql",
    "migrations/*.sql",
]

# Inside this repository the dependency is the checkout, not PyPI. uv ignores
# this when the package is installed from a built distribution.
[tool.uv.sources]
adcp = { workspace = true }
