name: Release publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Distribution to publish (each Release Please component publishes on its own)
        required: true
        type: choice
        default: adcp
        options:
          - adcp
          - adcp-reporting-storage
      release_sha:
        description: Exact commit of the Release Please release
        required: true
        type: string
      tag_name:
        description: Release Please tag
        required: true
        type: string

permissions: {}

concurrency:
  group: release-publish-${{ inputs.package }}-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Allow the 85-minute main CI lane plus queueing and distribution builds.
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: adcp_release_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Wait for successful main CI at the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          PACKAGE: ${{ inputs.package }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          # adcp tags are vX.Y.Z; the storage component tags carry its name.
          case "$PACKAGE" in
            adcp) [[ "$RELEASE_TAG" =~ ^v[0-9] ]] ;;
            adcp-reporting-storage) [[ "$RELEASE_TAG" =~ ^adcp-reporting-storage-v[0-9] ]] ;;
            *) echo "unknown package $PACKAGE" >&2; exit 1 ;;
          esac
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          for attempt in {1..220}; do
            if gh run list --workflow CI --event push --commit "$RELEASE_SHA" --json headSha,headBranch,status,conclusion --limit 20 |
              jq -e --arg sha "$RELEASE_SHA" 'any(.[]; .headSha == $sha and .headBranch == "main" and .status == "completed" and .conclusion == "success")'; then
              git checkout --detach "$RELEASE_SHA"
              exit 0
            fi
            sleep 30
          done
          echo 'Main CI did not pass for the release commit' >&2
          exit 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build and check distributions
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          python -m pip install build twine
          if [ "$PACKAGE" = adcp ]; then
            python -m build
          else
            python -m build --outdir dist/ packages/adcp-reporting-storage
          fi
          python -m twine check dist/*
      # Every release, on main and on next, needs a published companion it
      # actually works with, not one whose version range merely admits it
      # (#1763: adcp 10.0.0b4 installed beside adcp-reporting-storage 0.2.0b0
      # and failed every reporting turn). The gate installs the wheel just
      # built with the published companion into a private environment and
      # runs scripts/companion_smoke.py there: both sides must declare the same
      # storage contract, and the ledger must create its schema and round-trip
      # records on the PostgreSQL service above. For adcp the companion is the
      # newest published adcp-reporting-storage its range admits; for
      # adcp-reporting-storage it is the oldest and the newest published adcp
      # its own requirement accepts.
      - name: Require a companion release the built distribution works with
        env:
          PACKAGE: ${{ inputs.package }}
          ADCP_PG_TEST_URL: postgresql://postgres@localhost:5432/adcp_release_gate
        run: |
          python -m pip install packaging
          if [ "$PACKAGE" = adcp ]; then
            version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            python scripts/check_companion_releases.py "$version" --dist dist/adcp-*.whl
          else
            python scripts/check_companion_releases.py --package "$PACKAGE" --dist dist/adcp_reporting_storage-*.whl
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    environment: release-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
