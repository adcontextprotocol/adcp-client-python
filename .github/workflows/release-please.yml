name: Release Please

# Workflow 204238826 is deliberately retired, not renamed or re-enabled.
# Historical runs retain their old code: see docs/releasing.md before enabling
# the NEW publisher. This tombstone cannot make historical runs safe.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: retired-release-please
  cancel-in-progress: false

jobs:
  retired:
    name: Refuse the retired workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Refuse the retired publication entry point
        run: |
          echo 'Release Please is retired. Use the guarded proposal or publication workflow.' >&2
          exit 1
