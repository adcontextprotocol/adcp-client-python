name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: # Run once after re-enabling the previously disabled workflow.

permissions:
  contents: read
  actions: write # Queue the main-branch publication workflow for a created release.

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Mint release PR App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.IPR_APP_ID }}
          private-key: ${{ secrets.IPR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: adcp-client-python
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update the release PR, or create its release after merge
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Normalize the release PR's PEP 440 version
        if: steps.release.outputs.prs_created == 'true'
        run: python3 -m scripts.normalize_pyproject_prerelease --release-prs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PROPOSAL_PRS: ${{ steps.release.outputs.prs }}
      - name: Queue publication for the created release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release-publish.yml --ref main -f release_sha="$RELEASE_SHA" -f tag_name="$RELEASE_TAG"
