name: Release Please (next)

# Draft-spec line copy of main's release-please.yml. It runs from next only,
# opens release PRs against next with next's own config and manifest, and
# queues next's copy of release-publish.yml. Releases are 10.0.0-beta.N
# pre-releases of adcp and 0.2.0-beta.N pre-releases of adcp-reporting-storage
# (SDK 10's companion), each from its own component. main's release flow, config,
# and manifest are unchanged; this file and next's config and manifest are
# inert on main and are removed when next merges into main at ratification.
# See RELEASING.md.

on:
  push:
    branches: [next]
  workflow_dispatch: # Run once after creating or re-enabling the next line.

permissions:
  contents: read
  actions: write # Queue the next-branch publication workflow for a created release.

concurrency:
  group: release-please-next
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/next'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Mint release PR App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.IPR_APP_ID }}
          private-key: ${{ secrets.IPR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: adcp-client-python
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update the release PR, or create its release after merge
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: next
          config-file: release-please-config.next.json
          manifest-file: .release-please-manifest.next.json
      - name: Normalize the release PR's PEP 440 version
        if: steps.release.outputs.prs_created == 'true'
        run: python3 -m scripts.normalize_pyproject_prerelease --release-prs --target-branch next
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PROPOSAL_PRS: ${{ steps.release.outputs.prs }}
      - name: Queue publication for the created adcp release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release-publish.yml --ref next -f package=adcp -f release_sha="$RELEASE_SHA" -f tag_name="$RELEASE_TAG"
      - name: Queue publication for the created adcp-reporting-storage release
        if: steps.release.outputs['packages/adcp-reporting-storage--release_created'] == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs['packages/adcp-reporting-storage--sha'] }}
          RELEASE_TAG: ${{ steps.release.outputs['packages/adcp-reporting-storage--tag_name'] }}
        run: gh workflow run release-publish.yml --ref next -f package=adcp-reporting-storage -f release_sha="$RELEASE_SHA" -f tag_name="$RELEASE_TAG"
